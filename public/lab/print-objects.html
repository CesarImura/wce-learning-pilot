<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print objects</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:system-ui;padding:16px}
.wrap{background:#000;border-radius:16px;padding:16px;max-width:900px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:12px}
.g{display:flex;gap:4px;align-items:center}
.g button{background:#141414;border:1px solid #2a2a2a;color:rgba(255,255,255,.8);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:12px}
.g button.on{background:#6abef2;color:#04131d;border-color:#6abef2}
.g input{accent-color:#6abef2;width:90px}
.gridbox{position:relative}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.k{height:230px;border:1px solid #1f1f1f;border-radius:12px;background:#0d0d0d;position:relative}
.k p{position:absolute;left:12px;top:10px;margin:0;font-family:Newsreader,Georgia,serif;font-size:14px;color:#fff;z-index:1}
.k p span{opacity:.45}
.paper .k{background:#fff;border-color:#e6e3da}.paper .k p{color:#141414}.paper{background:#f1efe9}
#cv{position:absolute;left:0;top:0;pointer-events:none}
</style></head><body>
<div class="wrap" id="wrap">
<div class="bar">
<div class="g" data-k="map"><span>Texture</span><button class="on" data-v="0">Flat (like ref)</button><button data-v="1">Wrapped on object</button><button data-v="2">Per face</button></div>
<div class="g" data-k="draws"><span>Boil</span><button class="on" data-v="3">3 drawings</button><button data-v="999">Random</button><button data-v="0">Off</button></div>
<div class="g"><span>Texture size</span><input type="range" id="tex" min="0.3" max="2" step=".05" value="0.5"><span id="tv">0.5</span></div>
<div class="g"><span>Jump</span><input type="range" id="jump" min="0" max="2" step=".05" value="0"><span id="jv">0</span></div>
<div class="g" data-k="paper"><span>Cards</span><button class="on" data-v="0">Dark</button><button data-v="1">Paper</button></div>
</div>
<div class="gridbox" id="gb"><div class="grid">
<div class="k"><p><span>01</span> Candles 101</p></div>
<div class="k"><p><span>02</span> Market structure</p></div>
<div class="k"><p><span>03</span> Support and resistance</p></div>
<div class="k"><p><span>04</span> Trade plan</p></div>
<div class="k"><p><span>05</span> Risk per trade</p></div>
<div class="k"><p><span>06</span> Position sizing</p></div>
</div><canvas id="cv"></canvas></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const vs=`attribute vec3 fcol;attribute float fdir;attribute float ftype;varying vec3 vP;varying vec3 vON;varying vec3 vC;varying float vD;varying float vT;
uniform float uExplode;void main(){vT=ftype;vP=position;vON=normal;vC=fcol;vD=fdir;gl_Position=projectionMatrix*modelViewMatrix*vec4(position+normal*uExplode,1.);}`;
const fs=`uniform float uSeed,uJump,uMap,uDpr,uM,uTex;uniform vec2 uRes,uCtr;varying vec3 vP;varying vec3 vON;varying vec3 vC;varying float vD;varying float vT;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n2(p);p*=2.07;a*=.5;}return s;}
float stroke(vec2 uv,vec2 c,float an,float w,float len,vec2 o){float cs=cos(an),sn=sin(an);vec2 d=uv-c;float a=d.x*cs+d.y*sn,b=-d.x*sn+d.y*cs;
float ww=w*(1.+(fbm(vec2(a*.6,an*3.)+o*.003)-.5)*.9);float tp=smoothstep(-len,-len+.6,a)*(1.-smoothstep(len-1.2,len,a));
float br=n2(vec2(a*.45,b*11.)+o*.05);float dry=mix(.15,.6,smoothstep(-len*.3,len,a));return step(abs(b),ww*tp)*step(dry,br);}
void main(){vec3 N=normalize(vON);vec2 uv;vec2 uvS=(gl_FragCoord.xy/uDpr-uCtr)/40.;
if(uMap<.5){uv=uvS;}
else if(uMap>1.5){vec3 up=abs(N.y)>.9?vec3(1,0,0):vec3(0,1,0);vec3 T=normalize(cross(up,N));vec3 B=cross(N,T);uv=vec2(dot(vP,T),dot(vP,B))*2.4+vec2(vD*2.3,vD*1.1);}
else{vec3 a=abs(N);uv=(a.y>a.x&&a.y>a.z?vP.xz:(a.x>a.z?vP.zy:vP.xy))*2.4;}
uv/=uTex;float fsd=uM*7.31;vec2 o=vec2(h(vec2(uSeed,1.7+fsd)),h(vec2(uSeed,4.3+fsd)))*41.;
vec2 jit=(vec2(h(vec2(uSeed,9.1+fsd)),h(vec2(uSeed,2.2+fsd)))-.5)*.5*uJump;float aj=(h(vec2(uSeed,5.5+fsd))-.5)*.35*uJump;
vec2 c1=vec2(h(vec2(uM,1.))-.5,h(vec2(uM,2.))-.5)*2.2+jit,c2=vec2(h(vec2(uM,3.))-.5,h(vec2(uM,4.))-.5)*3.+jit*1.3,c3=vec2(h(vec2(uM,5.))-.5,h(vec2(uM,6.))-.5)*2.4+jit*.6;
float m=stroke(uv,c1,uM*2.1+aj,.55,3.2,o);
m=max(m,stroke(uv,c2,uM*2.1+1.9-aj,.28,2.,o+3.));
float lum=dot(vC,vec3(.3,.59,.11))-.08;
vec3 up=abs(N.y)>.9?vec3(1,0,0):vec3(0,1,0);vec3 Tb=normalize(cross(up,N));vec3 Bb=cross(N,Tb);
vec2 fu=uMap<.5?uvS*1.15+vec2(vD*3.1,vD*1.7)+jit*1.6:vec2(dot(vP,Tb),dot(vP,Bb))*2.4+jit*.4;fu/=uTex;float ca=cos(vD),sa=sin(vD);vec2 fr=mat2(ca,-sa,sa,ca)*fu;
float dk=lum<.25?.45:1.;float fm=0.;
if(vT>.5&&vT<1.5){float dens=smoothstep(-1.4,1.4,fr.y);fm=step(h(floor(fu*30.)+o),dens*(.35+.65*fbm(fu*1.3+vD+o*.01))*dk);}
else if(vT>1.5&&vT<2.5){vec2 g=mat2(.7071,-.7071,.7071,.7071)*fu*3.;vec2 f=fract(g)-.5;float rad=.47*smoothstep(-1.6,1.6,fr.x)*dk;fm=1.-smoothstep(rad-.06,rad,length(f));}
else if(vT>2.5){float l=fract(fr.y*2.6+(fbm(fu*.7+vD)-.5)*.5);fm=step(l,mix(.12,.55,smoothstep(-1.5,1.5,fr.x))*dk);}
m=max(m,fm);
m*=.84+.16*h(floor(uv*61.)+o);
vec3 col=lum<.25?mix(vC,vec3(.91,.9,.86),m*.85):vC*mix(vec3(1.),vec3(.07),m*.92);
col+=(h(floor(uv*90.)+3.+o)-.5)*.05;gl_FragColor=vec4(col,1.);}`;
const C={bone:[.913,.902,.863],blue:[.416,.745,.949],deep:[.122,.31,.47],black:[.2,.235,.26]};
const hs=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))>>>0;return x};
function prep(geo,pal,salt){const g=geo.index?geo.toNonIndexed():geo;g.computeVertexNormals();const P=g.attributes.position,Nn=g.attributes.normal,n=P.count;
const fc=new Float32Array(n*3),fd=new Float32Array(n),ft=new Float32Array(n),order={};let next=0;const off=hs(salt)%4;
for(let i=0;i<n;i+=3){const key=[Nn.getX(i),Nn.getY(i),Nn.getZ(i)].map(v=>Math.round(v*4)).join(',');if(!(key in order))order[key]=next++;const idx=order[key];
const c=C[pal[idx%pal.length]],k=hs(key+salt);
for(let j=0;j<3;j++){fc.set(c,(i+j)*3);fd[i+j]=(k%97)/97*6.28;ft[i+j]=(idx+off+Math.floor(idx/pal.length))%4}}
g.setAttribute('fcol',new THREE.BufferAttribute(fc,3));g.setAttribute('fdir',new THREE.BufferAttribute(fd,1));g.setAttribute('ftype',new THREE.BufferAttribute(ft,1));return g}
function tris(pts,idx){const g=new THREE.BufferGeometry();const a=[];idx.forEach(t=>t.forEach(i=>a.push(...pts[i])));g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));return g}
const box=(w,h,d,x,y,z)=>{const g=new THREE.BoxGeometry(w,h,d);g.translate(x,y,z);return g};
const MODELS=[
()=>{const pal=['bone','blue','black','bone'];const p=[[0,-1.05],[.34,-1.05],[.5,-.86],[.5,.86],[.34,1.05],[0,1.05]].map(q=>new THREE.Vector2(q[0],q[1]));
const w1=new THREE.CylinderGeometry(.05,.05,.75,4);w1.translate(0,1.42,0);const w2=new THREE.CylinderGeometry(.05,.05,.5,4);w2.translate(0,-1.3,0);
return {parts:[[new THREE.LatheGeometry(p,8),pal,'a'],[w1,['bone'],'w'],[w2,['bone'],'w']],rz:-.18}},
()=>{const pal=['blue','bone','black'];return {parts:[[box(.6,.4,1,-.6,-.5,0),pal,''],[box(.6,.8,1,0,-.3,0),pal,''],[box(.6,1.2,1,.6,-.1,0),pal,'']],rz:0}},
()=>{const xs=[-1.3,-.65,0,.65,1.3],ys=[0,.45,0,.45,0],pts=[],idx=[];xs.forEach((x,i)=>{pts.push([x,ys[i]-.4,-.55],[x,ys[i]-.4,.55])});
for(let i=0;i<4;i++){const a=i*2;idx.push([a,a+1,a+3],[a,a+3,a+2])}
const ball=new THREE.IcosahedronGeometry(.34,0);ball.translate(.45,.55,0);return {parts:[[tris(pts,idx),['blue','bone'],'z'],[ball,['black','deep','black'],'b']],rz:0}},
()=>{const N=[0,0,1.3],L=[-1,.12,-.85],R=[1,.12,-.85],K=[0,-.42,-.85],Cc=[0,.04,-.85];
return {parts:[[tris([N,L,R,K,Cc],[[0,1,4],[0,4,2],[0,4,3]]),['bone','blue','deep','bone'],'p']],rz:.1}},
()=>{const p=[[0,-1.35],[.72,-.25],[.72,.35],[.42,.95],[0,1.05]].map(q=>new THREE.Vector2(q[0],q[1]));return {parts:[[new THREE.LatheGeometry(p,6),['blue','black','bone','blue'],'c']],rz:.35}},
()=>{const pal=['bone','blue','black'];return {parts:[[box(1.1,1.1,1.1,-.35,-.4,.2),pal,'1'],[box(.72,.72,.72,.55,.5,-.3),['blue','bone','black'],'2']],rz:0}}];
const S={map:0,draws:3,jump:0,paper:0};
document.querySelectorAll('.g[data-k]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S[g.dataset.k]=+b.dataset.v;document.getElementById('wrap').classList.toggle('paper',!!S.paper)}));
S.tex=.5;const TX=document.getElementById('tex');TX.oninput=()=>{S.tex=+TX.value;document.getElementById('tv').textContent=TX.value};
const J=document.getElementById('jump');J.oninput=()=>{S.jump=+J.value;document.getElementById('jv').textContent=J.value};
const cv=document.getElementById('cv'),gb=document.getElementById('gb'),dpr=Math.min(2,devicePixelRatio);
const rd=new THREE.WebGLRenderer({canvas:cv,antialias:false,alpha:true});rd.setPixelRatio(dpr);rd.setScissorTest(true);
const cards=[...document.querySelectorAll('.k')];const hov=cards.map(()=>false);
const items=MODELS.map((mk,i)=>{const d=mk();const U={uTex:{value:1},uExplode:{value:0},uSeed:{value:0},uJump:{value:1},uMap:{value:0},uDpr:{value:dpr},uM:{value:i*1.37+.4},uRes:{value:new THREE.Vector2(1,1)},uCtr:{value:new THREE.Vector2(0,0)}};
const mat=new THREE.ShaderMaterial({uniforms:U,vertexShader:vs,fragmentShader:fs,side:THREE.DoubleSide});const grp=new THREE.Group();
const ms=d.parts.map(([geo,pal,salt])=>{const m=new THREE.Mesh(prep(geo,pal,salt),mat);m.userData.bp=m.position.clone();grp.add(m);return m});grp.rotation.z=d.rz;if(i===0){grp.scale.setScalar(.8);grp.position.y=-.45}const sc=new THREE.Scene();sc.add(grp);
const cam=new THREE.OrthographicCamera(-1,1,1,-1,.1,50);cam.position.set(3.2,2.2,5);cam.lookAt(0,0,0);
const it={U,grp,sc,cam,ms,yaw:i*.7,fold:0,hs:0};cards[i].onmouseenter=()=>{hov[i]=true;it.hs=performance.now()};cards[i].onmouseleave=()=>hov[i]=false;
return it});
const ob=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const ANIM=[
(it,th)=>{const s=1+.38*ob(Math.min(th/.45,1))+.04*Math.sin(th*6);const[b,w1,w2]=it.ms;b.scale.y=s;w1.position.y=1.42*(s-1);w2.position.y=-1.3*(s-1)},
(it,th)=>{it.ms.forEach((m,k)=>{const d=((th-k*.14)%1.3+1.3)%1.3;m.position.y=d<.45?.32*Math.sin(d/.45*Math.PI):0})},
(it,th)=>{const[f,b]=it.ms;const ph=(th%.8)/.8;b.position.y=1.1*4*ph*(1-ph);const sq=1-Math.max(0,1-ph/.1)*.35-Math.max(0,(ph-.9)/.1)*.35;b.scale.set(2-sq,sq,2-sq);f.scale.y=1-.25*Math.max(0,1-Math.abs(ph-.0)/.1)},
(it,th)=>{const m=it.ms[0];m.position.set(Math.sin(th*2.2)*.35,Math.sin(th*4.4)*.22+.1,Math.sin(th*2.2)*.2);m.rotation.set(-.25+Math.sin(th*4.4)*.12,0,Math.sin(th*2.2)*.45)},
(it,th)=>{const ph=(th%1.5)/1.5;it.U.uExplode.value=ph<.5?.38*Math.sin(ph/.5*Math.PI/2):.38*Math.max(0,1-ob(Math.min((ph-.5)/.3,1)));it.ms[0].rotation.y=ph*.6},
(it,th)=>{const w=(1-Math.cos(th*3.2))/2;const[a,b]=it.ms;a.scale.setScalar(1-.38*w);b.scale.setScalar(1+.55*w);b.position.y=.25*w}];
const rest=it=>{it.ms.forEach(m=>{m.position.lerp(m.userData.bp,.4);m.scale.lerp(new THREE.Vector3(1,1,1),.4);m.rotation.x*=.6;m.rotation.y*=.6;m.rotation.z*=.6});it.U.uExplode.value*=.5};
let cw=0,ch=0;
let last=0,tick=0;
(function loop(t){requestAnimationFrame(loop);if(t-last<83)return;last=t;tick++;
const R=gb.getBoundingClientRect();
if(Math.round(R.width)!==cw||Math.round(R.height)!==ch){cw=Math.round(R.width);ch=Math.round(R.height);rd.setSize(cw,ch)}
rd.setScissor(0,0,cw,ch);rd.clear();
items.forEach((it,i)=>{const r=cards[i].getBoundingClientRect(),x=r.left-R.left,y=R.bottom-r.bottom,w=r.width,h=r.height;
rd.setViewport(x,y,w,h);rd.setScissor(x,y,w,h);const s=2.2,a=w/h;Object.assign(it.cam,{left:-s*a,right:s*a,top:s*.74,bottom:-s*1.26});it.cam.updateProjectionMatrix();
it.U.uSeed.value=S.draws?(S.draws>100?tick:tick%S.draws)+1:0;it.U.uJump.value=S.draws?S.jump:0;it.U.uMap.value=S.map;it.U.uTex.value=S.tex;it.U.uRes.value.set(cw,ch);it.U.uCtr.value.set(x+w/2,y+h/2);
it.yaw+=.05;if(hov[i])ANIM[i](it,(performance.now()-it.hs)/1000);else rest(it);it.fold+=((hov[i]?1:0)-it.fold)*.35;it.grp.rotation.y=it.yaw;it.grp.rotation.x=Math.sin(t/1100+i)*.08+it.fold*.22;
rd.render(it.sc,it.cam)})})(0);
</script></body></html>
